name: Supabase Keep-Alive

# Supabase Free projects can be paused after 7 days of insufficient user
# database activity. This runs roughly every 2 days for BOTH VitalNet projects
# and issues one read-only SELECT against the public facilities table per
# project. The response body is discarded; no patient payload is returned,
# stored, or logged.
#
# Production project: SUPABASE_URL + SUPABASE_ANON_KEY
# Preproduction project: TEST_SUPABASE_URL + TEST_SUPABASE_ANON_KEY
#
# These are repository secrets, not values committed to Git. The anonymous
# keys are least-privilege publishable keys; do not substitute a service-role
# key. GitHub scheduled workflows execute from the repository default branch.

on:
  schedule:
    - cron: "17 4 */2 * *"
  workflow_dispatch: {}

concurrency:
  group: supabase-both-projects-keepalive
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: production
            url_secret: SUPABASE_URL
            key_secret: SUPABASE_ANON_KEY
          - name: preproduction
            url_secret: TEST_SUPABASE_URL
            key_secret: TEST_SUPABASE_ANON_KEY
    steps:
      - name: Ping ${{ matrix.name }} Supabase database
        env:
          SUPABASE_URL: ${{ matrix.url_secret == 'SUPABASE_URL' && secrets.SUPABASE_URL || secrets.TEST_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ matrix.key_secret == 'SUPABASE_ANON_KEY' && secrets.SUPABASE_ANON_KEY || secrets.TEST_SUPABASE_ANON_KEY }}
        run: |
          set -eu
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "${{ matrix.name }} Supabase keep-alive credentials are not configured — skipping."
            exit 0
          fi
          status=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 45 \
            "$SUPABASE_URL/rest/v1/facilities?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "${{ matrix.name }} Supabase REST responded HTTP $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 400 ]; then
            echo "::error::${{ matrix.name }} Supabase keep-alive failed (HTTP $status)"
            exit 1
          fi
