name: Deno Dependency Audit (apps/api)

# Audits apps/api Deno dependencies on a schedule and for PRs touching apps/api (VN-2026-08-C8-02).
# Deno is not natively supported by Dependabot, so this workflow provides automated
# vulnerability scanning and outdated dependency detection for the edge function backend.

on:
  schedule:
    - cron: '0 4 * * 1' # Every Monday at 04:00 UTC
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/deno-deps-audit.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit-deno-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'

      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: '10'

      - name: Build clinical-core prerequisite
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @vitalnet/clinical-core build

      - uses: denoland/setup-deno@041b854f97b325bd60e8371617cfd148f181659f # v2.1.4
        with:
          deno-version: v2.x

      - name: Type check Deno edge functions
        working-directory: apps/api/supabase/functions/api
        run: deno check index.ts

      - name: Audit Deno dependencies
        working-directory: apps/api/supabase/functions/api
        run: |
          echo "Checking Deno dependencies lockfile and imports..."
          deno info index.ts
