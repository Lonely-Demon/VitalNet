name: Backend Keep-Alive

# Render Free web services spin down after 15 minutes without inbound traffic.
# This workflow keeps ONLY the preproduction backend warm. Production Render is
# intentionally excluded from this workflow by product decision.
#
# This is still best-effort because GitHub schedule triggers can be delayed.
# It must not be treated as a contractual uptime monitor or a substitute for
# a paid always-on service. The target is a public, unauthenticated health
# endpoint and no patient payload is sent or retained.
#
# GitHub scheduled workflows run from the default branch. Keep this file on the
# default branch as well as dev when the preproduction keep-alive is activated.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: backend-preproduction-keepalive
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ping-preproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping preproduction /api/health
        env:
          PREPROD_BACKEND_HEALTH_URL: https://vitalnet-preprod-api.onrender.com
        run: |
          set -eu
          for attempt in 1 2 3; do
            status=$(curl -sS -o /dev/null -w "%{http_code}" \
              --connect-timeout 10 --max-time 30 \
              "$PREPROD_BACKEND_HEALTH_URL/api/health") || status="000"
            echo "Preproduction backend /api/health attempt $attempt responded HTTP $status"

            # Any HTTP response below 500 proves the service is reachable.
            if [ "$status" -ge 200 ] && [ "$status" -lt 400 ]; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep 5
            fi
          done

          echo "::error::Preproduction backend health check failed after 3 attempts (last HTTP $status)"
          exit 1
